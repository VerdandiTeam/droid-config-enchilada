# Jolla's /sbin/preinit runs "ulimit -s 2048", capping the stack at 2 MB
# for everything. Android services expect the usual 8 MB: the Goodix FOD
# fingerprint HAL (libgf_ud_hal.so, goodix::SZAlgo::init) needs a >4 MB
# stack frame and segfaults with 2 MB, which makes sailfish-fpd-community
# abort in a loop. Give droid-hal-init (and so every Android service) 8 MB.
[Service]
LimitSTACK=8M
